# Windows preview: test Evoo's rules against the Mac app's cases, run speech → text end to end on real Windows,
# build the app, self-test it, and publish it as the "windows" release (what the website links to).
# Never marked "latest": the Mac app's updater and the Mac download keep pointing at the Mac build.
name: Windows

on:
  push:
    branches: [main]
    paths: [windows/**, .github/workflows/windows.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      EVOO_MODEL_DIR: ${{ github.workspace }}\models
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Rules match the Mac app
        run: dotnet test windows/Evoo.Core.Tests --logger "console;verbosity=detailed"

      - name: Speech model (cached between runs)
        uses: actions/cache@v4
        with:
          path: models
          key: parakeet-v3-int8-2bda32ec

      - name: End to end — a voice speaks, Evoo writes
        run: dotnet run --project windows/Evoo.E2E -c Release

      - name: Build the app
        run: dotnet publish windows/Evoo.Windows -c Release -o out/Evoo -p:Version=0.1.${{ github.run_number }}

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath out/Evoo/Evoo.exe -ArgumentList '--self-test', "$PWD\self-test.txt" -PassThru -Wait
          Get-Content self-test.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/Evoo -DestinationPath Evoo-windows.zip
          "{0:N1} MB" -f ((Get-Item Evoo-windows.zip).Length / 1MB)

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          SHA=$(sha256sum Evoo-windows.zip | cut -d' ' -f1)
          SIZE=$(stat -c %s Evoo-windows.zip)
          echo "$SHA  Evoo-windows.zip" > Evoo-windows.zip.sha256
          printf '{"build": %s, "version": "0.1.%s", "sha256": "%s", "size": %s}\n' "$BUILD" "$BUILD" "$SHA" "$SIZE" > version.json
          cat version.json
          NOTES="Evoo for Windows, preview build $BUILD. Hold Ctrl + Win, speak, let go: the text is typed at the cursor. Speech recognition and Evoo's correction rules run on the PC. Unzip, run Evoo.exe (SmartScreen: More info → Run anyway; the build isn't code-signed yet), and follow the setup window."
          if gh release view windows >/dev/null 2>&1; then
            gh release upload windows Evoo-windows.zip Evoo-windows.zip.sha256 version.json --clobber
            gh release edit windows --title "Evoo for Windows (preview build $BUILD)" --notes "$NOTES" --latest=false --prerelease
          else
            gh release create windows Evoo-windows.zip Evoo-windows.zip.sha256 version.json \
              --latest=false --prerelease --target "$GITHUB_SHA" --title "Evoo for Windows (preview build $BUILD)" --notes "$NOTES"
          fi
