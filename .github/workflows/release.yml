# Every push to main: run the tests, build Evoo.app, and publish it as a GitHub release ("build-N").
# Installed copies of Evoo check for the newest release and offer "Install Update" in the menu bar.
name: Release

on:
  push:
    branches: [main]
    paths-ignore: [site/**, .github/workflows/pages.yml, "*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Test
        run: swift test

      - name: Build and package
        env:
          EVOO_BUILD: ${{ github.run_number }}
          EVOO_REPO: ${{ github.repository }}
        run: |
          scripts/bundle.sh
          scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          printf '%s\n\n%s\n' "${COMMIT_MESSAGE:-Manual build}" \
            "Install or update: see the README. Already installed? Evoo menu → Install Update." > notes.md
          cp build/Evoo.zip build/Evoo-update.zip && cp build/Evoo.zip.sha256 build/Evoo-update.zip.sha256
          gh release create "build-${{ github.run_number }}" build/Evoo.zip build/Evoo.zip.sha256 build/Evoo-update.zip build/Evoo-update.zip.sha256 \
            --title "Evoo build ${{ github.run_number }}" --notes-file notes.md --latest
