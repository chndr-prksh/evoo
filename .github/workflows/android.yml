# Android: test Evoo's rules against the Mac app's cases, build the APK, publish it as the "android" release.
# Runs in the cloud so nothing heavy runs on a developer's Mac. Not marked "latest": the Mac app's updater and
# the website's download link keep pointing at the Mac build.
name: Android

on:
  push:
    branches: [main]
    paths: [android/**, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHERPA_VERSION: 1.13.8
      SHERPA_SHA256: 633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Rules match the Mac app
        working-directory: android
        run: gradle :core:test --console=plain

      - name: Speech engine (sherpa-onnx, checksum-pinned)
        run: |
          curl -fsSL -o android/app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
          echo "${SHERPA_SHA256}  android/app/libs/sherpa-onnx.aar" | sha256sum -c -

      # Signed with Evoo's own key, so an update installs over the old version.
      - name: Build the APK
        working-directory: android
        env:
          EVOO_BUILD: ${{ github.run_number }}
          EVOO_KEYSTORE_B64: ${{ secrets.EVOO_KEYSTORE_B64 }}
          EVOO_KEYSTORE_PASSWORD: ${{ secrets.EVOO_KEYSTORE_PASSWORD }}
        run: |
          echo "$EVOO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/evoo.keystore"
          export EVOO_KEYSTORE="$RUNNER_TEMP/evoo.keystore"
          gradle :app:assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/evoo.keystore"
          cp app/build/outputs/apk/release/app-release.apk ../Evoo-android.apk
          ls -la ../Evoo-android.apk

      # The "android" release is what the website links to and what the app checks for updates.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          SHA=$(sha256sum Evoo-android.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s Evoo-android.apk)
          echo "$SHA  Evoo-android.apk" > Evoo-android.apk.sha256
          printf '{"build": %s, "version": "0.1.%s", "sha256": "%s", "size": %s}\n' "$BUILD" "$BUILD" "$SHA" "$SIZE" > version.json
          cat version.json
          NOTES="Evoo voice keyboard for Android, build $BUILD. Speech recognition, Evoo's correction rules and AI polish all run on the phone. Install the APK, open Evoo, and follow the setup steps. The app updates itself from this release."
          if gh release view android >/dev/null 2>&1; then
            gh release upload android Evoo-android.apk Evoo-android.apk.sha256 version.json --clobber
            gh release edit android --title "Evoo for Android (build $BUILD)" --notes "$NOTES" --latest=false --prerelease=false
          else
            gh release create android Evoo-android.apk Evoo-android.apk.sha256 version.json \
              --latest=false --target "$GITHUB_SHA" --title "Evoo for Android (build $BUILD)" --notes "$NOTES"
          fi
          gh release delete android-preview --yes --cleanup-tag 2>/dev/null || true
